<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thiệp Cưới Văn Mạnh & Thu Trang</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
  <!-- Nhạc nền -->
  <audio id="bg-music" autoplay loop muted>
    <source src="music/wedding.mp3" type="audio/mpeg">
  </audio>

  <div class="wedding-wrapper">

    <!-- Hero -->
    <section class="hero">
      <div class="hero-content">
        <img src="img/Happy_Weeding.png" class="hero-title fade-in">
        <img src="img/couple.png" alt="Couple" class="hero-img">
        <img src="img/Thu_Trang_Van_Manh.png" class="couple-name fade-in">
        <img src="img/thang_10.png" class="wedding-date-month fade-in">
        <img src="img/ngay_cuoi.png" class="wedding-date fade-in">
        <img src="img/2025.png" class="wedding-date-year fade-in">
        <img src="img/ngay_cuoi_am_lich.png" class="wedding-date-lunar-calendar fade-in">
        <img src="img/hoa_element.png" class="hoa_element">
      </div>
    </section>

    <!-- Thông tin -->
    <section class="ourwedding-info">
      <img src="img/ourweddingday.png" class="ourwedding-1 fade-in">
      <img src="img/tran_trong_kinh_moi.png" class="ourwedding-2 fade-in">
      <img src="img/ban_va_gia_dinh.png" class="ourwedding-3 fade-in">
      <img src="img/den_du_buoi_tiec_chung_vui_cung_gia_dinh_chung_toi.png" class="ourwedding-4 fade-in">

      <div class="ourwedding-grid">
        <img src="img/nha_trai_nha_gai.png" class="ourwedding-grid-1 fade-in">
        <img src="img/ten_co_dau_chu_re.png" class="ourwedding-grid-2 fade-in">
        <img src="img/line.png" class="ourwedding-grid-3 fade-in">
        <img src="img/bo_co_dau_chu_re.png" class="ourwedding-grid-4 fade-in">
        <img src="img/me_co_dau_chu_re.png" class="ourwedding-grid-5 fade-in">
      </div>

      <img src="img/line_2.png" class="ourwedding-5 fade-in">

      <!-- Nhà trai -->
      <img src="img/tiec_cuoi_nha_trai.png" class="ourwedding-6 fade-in">
      <img src="img/dia_chi_nha_trai.png" class="ourwedding-7 fade-in">
      <img src="img/ngay_cuoi_nha_trai_duong_lich.png" class="ourwedding-8 fade-in">
      <img src="img/ngay_cuoi_nha_trai_am_lich.png" class="ourwedding-9 fade-in">
      <img src="img/map_nha_trai.png" class="ourwedding-10 fade-in">
      <button class="ourwedding-button" onclick="openMap1()"></button>

      <!-- Nhà gái -->
      <img src="img/tiec_cuoi_nha_gai.png" class="ourwedding-6 fade-in">
      <img src="img/dia_chi_nha_gai.png" class="ourwedding-11 fade-in">
      <img src="img/ngay_gio_an_co_nha_gai_duong_lich.png" class="ourwedding-8 fade-in">
      <img src="img/ngay_gio_an_co_nha_gai_am_lich.png" class="ourwedding-9 fade-in">
      <img src="img/map_nha_gai.png" class="ourwedding-10 fade-in">
      <button class="ourwedding-button" onclick="openMap2()"></button>

      <img src="img/hoa_element.png" class="hoa_element">
    </section>

    <!-- Khoảnh khắc -->
    <section class="ourweddingwoments-info">
      <img src="img/ourweddingmoment.png" class="ourweddingwoments-1 fade-in">

      <div class="grid-1">
        <img src="img/together.png" class="grid-1_0">
        <img src="img/anh_cuoi_2.png" class="grid-1_2">
        <img src="img/anh_cuoi_3.png" class="grid-1_3">
        <img src="img/mo_ta_together.png" class="grid-1_6">
        <img src="img/anh_cuoi_1.png" class="grid-1_1">
        <img src="img/anh_cuoi_5.png" class="grid-1_5">
        <img src="img/anh_cuoi_4.png" class="grid-1_4">
      </div>

      <div class="grid-2">
        <img src="img/memories.png" class="grid-2_0">
        <img src="img/mo_ta_memories.png" class="grid-2_1">
        <img src="img/anh_cuoi_9.png" class="grid-2_5">
        <img src="img/anh_cuoi_6.png" class="grid-2_2">
        <img src="img/anh_cuoi_7.png" class="grid-2_3">
        <img src="img/anh_cuoi_10.png" class="grid-2_6">
        <img src="img/anh_cuoi_8.png" class="grid-2_4">
      </div>

      <div class="grid-3">
        <img src="img/anh_cuoi_11.png" class="grid-3_2">
        <img src="img/forever.png" class="grid-3_0">
        <img src="img/mo_ta_forever.png" class="grid-3_1">
        <img src="img/anh_cuoi_13.png" class="grid-3_4">
        <img src="img/anh_cuoi_12.png" class="grid-3_3">
        <img src="img/anh_cuoi_14.png" class="grid-3_5">
      </div>

      <img src="img/hoa_element.png" class="hoa_element">
    </section>

    <!-- Tham dự -->
    <section class="ourattendding-info">
      <img src="img/our_attendding.png" class="ourattendding-1 fade-in">
      <img src="img/mo_ta_ourattendding.png" class="ourattendding-2 fade-in">
    </section>

    <!-- Form RSVP -->
    <section class="rsvp-form">
      <form id="rsvp-form">

        <!-- Nhập tên -->
        <div class="form-section">
          <img src="img/ten_cua_ban.png" class="form-section-1" alt="Tên của bạn">
          <div class="input-wrapper">
            <input type="text" name="name" class="form-section-2" placeholder="Tên của bạn...">
            <img src="img/o_dien_ten.png" class="form-section-3" alt="Ô điền tên">
          </div>
        </div>
        <div class="wedding-form-1">
          <!-- Bạn là khách mời của ai -->
          <img src="img/ban_la_khac_moi_cua_ai.png" class="chon-nguoi-title">
          
          <div class="chon-nguoi">
            <label class="option">
              <input type="radio" name="option" value="chu_re">
              <img src="img/chu_re.png" alt="Chú rể">
              <span class="checkmark"></span>
            </label>
            
            <label class="option">
              <input type="radio" name="option" value="co_dau">
              <img src="img/co_dau.png" alt="Cô dâu">
              <span class="checkmark"></span>
            </label>
          </div>
          <img src="img/ban_se_den_chu.png" class="tham_du-title">
          <!-- Tham dự -->
          <div class="tham-du">
            <label>
              <input type="radio" name="attend" value="yes">
              <img src="img/minh_se_den_khi_chua_tich.png" class="tham-du-1" alt="Mình sẽ đến">
            </label>
            
            <label>
              <input type="radio" name="attend" value="no">
              <img src="img/tiec_qua_minh_khong_den_duoc_khi_chua_tich.png" class="tham-du-2" alt="Không đến được">
            </label>
          </div>
          <div class="form-wish">
            <img src="img/gui_loi_chuc.png" class="form-wish-1" alt="Tên của bạn">
            <div class="input-wrapper-1">
              <textarea type="text" name="message" class="form-wish-2" placeholder="Ghi lời chúc của bạn ..."></textarea>
              <img src="img/phan_o_vuong_ghi_loi_chuc.png" class="form-wish-3" alt="Ô điền tên">
            </div>
          </div>
        </div>
      
        <button type="submit" class="submit-btn">
        <img src="img/xac_nhan_tham_du.png" class="submit-btn-img" alt="Xác nhận tham dự">
        </button>
      </form>

      <img src="img/hoa_element2.png" class="hoa_element2">
    </section>

    <section class="outwedding-gifts">
      <img src="img/our_attendding_gifts.png" class="outwedding-gifts-1">
      <img src="img/mo_ta_our_gifts.png" class="outwedding-gifts-2">
      <img src="img/QR_co_dau_chu_re.png" class="outwedding-gifts-3">
      <img src="img/text_co_dau_chu_re.png" class="outwedding-gifts-4">
      <img src="img/ten_so_tai_khoan.png" class="outwedding-gifts-5">
      <img src="img/so_tai_khoan.png" class="outwedding-gifts-6">
      <img src="img/ngan_hang.png" class="outwedding-gifts-7">

      <img src="img/hoa_element3.png" class="hoa_element3">
    </section>
  </div>

  <script src="js/script.js"></script>
</body>
</html>

<script>
  function openMap1() {
    window.open(
      "https://maps.app.goo.gl/aBBFmJMS8Z9tvqub7",
      "_blank"
    );
  }

  function openMap2() {
    window.open("https://maps.app.goo.gl/C8RbDHPLZSELk1TaA?g_st=ipc", "_blank");
  }
</script>
